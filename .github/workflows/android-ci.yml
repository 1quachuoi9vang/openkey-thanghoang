name: Android CI/CD

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test-android:
    name: Build, Test & Package Android APK (Samsung Galaxy A37)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Shared Lexicon Parity Check
        run: python3 scripts/sync_shared_lexicon.py --check

      - name: Run Unit Tests and Assemble APK
        run: ./gradlew :openkey-core:test :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare Named Release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/OpenKey-Android-A37.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenKey-Android-A37
          path: app/build/outputs/apk/debug/OpenKey-Android-A37.apk

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('OpenKey {0}', github.ref_name) || 'OpenKey Android (Samsung Galaxy A37) — Latest APK' }}
          prerelease: false
          make_latest: true
          files: app/build/outputs/apk/debug/OpenKey-Android-A37.apk
